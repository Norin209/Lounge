[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "http://premierlounge.co/*"
  to = "https://premierlounge.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.premierlounge.co/*"
  to = "https://premierlounge.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.premierlounge.co/*"
  to = "https://premierlounge.co/:splat"
  status = 301
  force = true